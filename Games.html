<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Run</title>
<style>
:root {
  --bg:#f7f7f7;
  --fg:#535353;
  --btn:#e4e4e4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
  
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#202124;--fg:#acacac;--btn:#33363a;color-scheme:dark
  }
}
  
:root[data-theme="dark"] {
  --bg:#202124;
  --fg:#acacac;
  --btn:#33363a;
  color-scheme:dark
}
  
html {
  height:100%;
  scroll-padding-top:env(safe-area-inset-top,0px)
}
  
body {
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--fg);
  font:14px ui-monospace,Menlo,Consolas,monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;touch-action:manipulation;
  user-select:none;-webkit-user-select:none
}
  
canvas {
  width:min(94vw,720px);
  aspect-ratio:600/160;
  display:block
}
  
.pad {
  display:none;
  gap:12px
}
  
@media (pointer:coarse) {
  .pad {
    display:flex}
}
button {
  font:inherit;
  color:var(--fg);
  background:var(--btn);
  border:0;
  border-radius:8px;
  padding:16px 32px;
  touch-action:none
}
  
button:focus-visible {
  outline:2px solid var(--fg);
  outline-offset:2px
}
  
</style>
</head>
<body>
<canvas id="c" aria-label="Dino runner game"></canvas>
<div class="pad"><button id="bj">Jump</button><button id="bd">Duck</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=600,H=160,G=130,dpr=Math.min(window.devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const css=getComputedStyle(document.documentElement);
const BODY=[
"..........########..",
"..........##.#####..",
"..........########..",
"..........########..",
"..........#####.....",
"..........######....",
"#.........####......",
"#........#####......",
"##.....#######.#....",
"###...##########....",
".##############.#...",
".##############.....",
"..############......",
"...##########.......",
"....########........"];
const L1=[".....##....#........",".....#..............",".....##............."];
const L2=["....#.....##........","..........#.........","..........##........"];
const DUCK=[
"..............#######...",
"..............##.#####..",
"..............########..",
"#............#####......",
"##.....#############....",
"###..################...",
".###################....",
"..#################.....",
"...###############......"];
const DL1=["....##.........#........"],DL2=[".........#....##........"];
function spr(rows,x,y){for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++)
if(rows[r][c]==='#')ctx.fillRect(x+c*2,y+r*2,2,2)}
let hi=0;try{hi=+localStorage.getItem('dino-hi')||0}catch(e){}
let s,duck=false;
function reset()
{s={y:0,vy:0,speed:6,score:0,obs:[],next:300,gx:0,over:false,started:false,t:0,dead:0,clouds:
  [{x:120,y:30},{x:380,y:55},{x:560,y:25}]}}
reset();
function press(){
  const now=performance.now();
  if(s.over){if(now-s.dead>350){reset();s.started=true;jump()}return}
  if(!s.started)s.started=true;
  jump();
}
function jump(){if(s.y===0){s.vy=11}}
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press()}
  else if(e.code==='ArrowDown'){e.preventDefault();duck=true}
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck=false});
cv.addEventListener('pointerdown',press);
const bj=document.getElementById('bj'),bd=document.getElementById('bd');
bj.addEventListener('pointerdown',press);
bd.addEventListener('pointerdown',()=>{duck=true});
['pointerup','pointerleave','pointercancel'].forEach(n=>bd.addEventListener(n,()=>{duck=false}));

function spawn(){
  if(s.score>250&&Math.random()<.25){
    s.obs.push({k:'p',x:W+10,w:44,h:24,b:[10,30,62][Math.floor(Math.random()*3)]});
  }else{
    const big=Math.random()<.4,w=big?25:17,h=big?50:34,n=1+Math.floor(Math.random()*(big?2:3));
    s.obs.push({k:'c',x:W+10,w:n*(w+3)-3,uw:w,h:h,n:n,b:0});
  }
  s.next=220+Math.random()*260+s.speed*12;
}
function update(dt){
  s.t+=dt*16.67;
  s.speed=Math.min(13,s.speed+0.0015*dt);
  s.score+=s.speed*dt*0.025;
  s.gx+=s.speed*dt;
  if(s.y>0||s.vy>0){
    s.y+=s.vy*dt;
    s.vy-=(duck&&s.y>0?2:0.6)*dt;
    if(s.y<=0){s.y=0;s.vy=0}
  }
  s.clouds.forEach(c=>{c.x-=s.speed*0.2*dt;if(c.x<-50){c.x=W+Math.random()*80;c.y=20+Math.random()*50}});
  s.next-=s.speed*dt;
  if(s.next<=0)spawn();
  s.obs.forEach(o=>{o.x-=(s.speed+(o.k==='p'?1.5:0))*dt});
  s.obs=s.obs.filter(o=>o.x+o.w>-10);
  const d=duck&&s.y===0;
  const dx=d?34:36,dw=d?40:28,dy=d?G-s.y-18:G-s.y-32,dh=d?16:30;
  for(const o of s.obs){
    const ox=o.x+3,ow=o.w-6,oh=o.k==='p'?20:o.h-4,oy=G-o.b-oh-(o.k==='p'?2:0);
    if(dx<ox+ow&&dx+dw>ox&&dy<oy+oh&&dy+dh>oy){
      s.over=true;s.dead=performance.now();
      if(s.score>hi){hi=s.score;try{localStorage.setItem('dino-hi',String(Math.floor(hi)))}catch(e){}}
      break;
    }
  }
}
function cactus(o){
  for(let i=0;i<o.n;i++){
    const x=o.x+i*(o.uw+3),w=o.uw,h=o.h,tw=Math.max(7,w*.34),tx=x+(w-tw)/2;
    ctx.fillRect(tx,G-h,tw,h);
    ctx.fillRect(x,G-h*.6,tx-x+1,5);ctx.fillRect(x,G-h*.6-12,5,17);
    ctx.fillRect(tx+tw-1,G-h*.42,x+w-tx-tw+1,5);ctx.fillRect(x+w-5,G-h*.42-10,5,15);
  }
}
function ptero(o){
  const x=o.x,y=G-o.b-24,up=Math.floor(s.t/150)%2===0;
  ctx.fillRect(x+8,y+10,30,8);ctx.fillRect(x,y+12,10,3);ctx.fillRect(x+34,y+8,10,5);
  ctx.fillRect(x+38,y+13,6,3);
  ctx.beginPath();
  if(up){ctx.moveTo(x+14,y+10);ctx.lineTo(x+30,y+10);ctx.lineTo(x+20,y)}
  else{ctx.moveTo(x+14,y+18);ctx.lineTo(x+30,y+18);ctx.lineTo(x+22,y+24)}
  ctx.fill();
}
function pad(n){return String(Math.floor(n)).padStart(5,'0')}
function draw(){
  ctx.clearRect(0,0,W,H);
  const fg=css.getPropertyValue('--fg').trim()||'#535353';
  ctx.fillStyle=fg;ctx.strokeStyle=fg;
  ctx.globalAlpha=.3;
  s.clouds.forEach(c=>{ctx.fillRect(c.x+6,c.y,30,8);ctx.fillRect(c.x,c.y+5,46,8)});
  ctx.globalAlpha=1;
  ctx.fillRect(0,G,W,1);
  for(let i=0;i<W+30;i+=30){
    const k=Math.floor((i+s.gx)/30),h=(k*2654435761>>>0)%7;
    ctx.fillRect(i-(s.gx%30)+h*3,G+5+(h%3)*4,2+h%3,1);
  }
  s.obs.forEach(o=>o.k==='c'?cactus(o):ptero(o));
  const running=s.started&&!s.over,f=Math.floor(s.t/100)%2;
  if(duck&&s.y===0&&!s.over){
    spr(DUCK,30,G-20);spr(f?DL1:DL2,30,G-2);
  }else{
    const legs=(s.y>0||!running)?L1:(f?L1:L2);
    spr(BODY,30,G-36-s.y);spr(legs,30,G-6-s.y);
  }
  ctx.font='bold 14px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign='right';
  ctx.globalAlpha=.6;ctx.fillText('HI '+pad(hi),W-90,20);ctx.globalAlpha=1;
  ctx.fillText(pad(s.score),W-10,20);
  ctx.textAlign='center';
  if(!s.started)ctx.fillText('Press space or tap to start',W/2,70);
  if(s.over){
    ctx.font='bold 20px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText('Game over',W/2,60);
    ctx.font='14px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText('Press space or tap to restart',W/2,86);
  }
}
let last=0;
function loop(t){
  const dt=Math.min((t-last)/16.67||1,3);last=t;
  if(s.started&&!s.over)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
